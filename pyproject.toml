[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness"
version = "0.1.0"
description = "Centralized local AI harness and RAG workspace with Codex integration"
requires-python = ">=3.10"

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
